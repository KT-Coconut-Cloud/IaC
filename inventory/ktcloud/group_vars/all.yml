---
target_environment: ktcloud
target_inventory_hosts:
  - m1
  - w1
  - w2
os_baseline_expected_hosts:
  m1: SET_KTCLOUD_M1_PRIVATE_IP
  w1: SET_KTCLOUD_W1_PRIVATE_IP
  w2: SET_KTCLOUD_W2_PRIVATE_IP
k3s_api_host: "{{ hostvars['m1'].ansible_host }}"
k3s_server_url: "https://{{ k3s_api_host }}:6443"
k3s_expected_nodes:
  - k3s-m1
  - k3s-w1
  - k3s-w2
k3s_worker_nodes:
  - k3s-w1
  - k3s-w2
controller_ssh_hosts:
  - alias: kt-m1
    hostname: SET_KTCLOUD_M1_PRIVATE_IP
    user: SET_EC2_LOGIN_USER
    identity_file: /home/admin/.ssh/id_ed25519_ansible
  - alias: kt-w1
    hostname: SET_KTCLOUD_W1_PRIVATE_IP
    user: SET_EC2_LOGIN_USER
    identity_file: /home/admin/.ssh/id_ed25519_ansible
  - alias: kt-w2
    hostname: SET_KTCLOUD_W2_PRIVATE_IP
    user: SET_EC2_LOGIN_USER
    identity_file: /home/admin/.ssh/id_ed25519_ansible
