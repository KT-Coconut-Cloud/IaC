[k3s_servers]
m1 ansible_host=SET_KTCLOUD_M1_PRIVATE_IP ansible_user=SET_EC2_LOGIN_USER ansible_ssh_private_key_file=/home/admin/.ssh/id_ed25519_ansible node_hostname=k3s-m1

[k3s_agents]
w1 ansible_host=SET_KTCLOUD_W1_PRIVATE_IP ansible_user=SET_EC2_LOGIN_USER ansible_ssh_private_key_file=/home/admin/.ssh/id_ed25519_ansible node_hostname=k3s-w1
w2 ansible_host=SET_KTCLOUD_W2_PRIVATE_IP ansible_user=SET_EC2_LOGIN_USER ansible_ssh_private_key_file=/home/admin/.ssh/id_ed25519_ansible node_hostname=k3s-w2

[k3s_cluster:children]
k3s_servers
k3s_agents

[all:vars]
target_environment=ktcloud
