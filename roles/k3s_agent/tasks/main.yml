---
- name: Require the environment-specific K3s endpoint and confirmed version
  ansible.builtin.assert:
    that:
      - k3s_server_url is match('^https://')
      - k3s_version_confirmed | bool
      - k3s_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')
      - vault_k3s_tokens[target_environment] is defined
    fail_msg: Confirm the server endpoint, pinned release, and encrypted token before joining agents.
  no_log: true

- name: Require expected host mapping
  ansible.builtin.assert:
    that:
      - inventory_hostname in os_baseline_expected_hosts
      - ansible_host == os_baseline_expected_hosts[inventory_hostname]
    fail_msg: "Agent host does not match the declared environment inventory."

- name: Detect an existing K3s binary
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_agent_binary

- name: Read the installed K3s version without changing it
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, --version]
  register: k3s_agent_installed_version
  changed_when: false
  failed_when: false
  when: k3s_agent_binary.stat.exists

- name: Refuse to replace an unapproved existing K3s version
  ansible.builtin.assert:
    that:
      - not k3s_agent_binary.stat.exists or k3s_version in k3s_agent_installed_version.stdout
    fail_msg: Existing K3s version differs from the pinned release; review it instead of upgrading automatically.
  when: k3s_agent_binary.stat.exists

- name: Detect an existing K3s configuration
  ansible.builtin.stat:
    path: /etc/rancher/k3s/config.yaml
  register: k3s_agent_config_stat

- name: Check whether an existing configuration is managed by this repository
  ansible.builtin.command:
    argv: [grep, -Fq, "# Ansible-managed K3s configuration", /etc/rancher/k3s/config.yaml]
  register: k3s_agent_config_marker
  changed_when: false
  failed_when: false
  when: k3s_agent_config_stat.stat.exists

- name: Refuse to overwrite an unowned K3s configuration
  ansible.builtin.assert:
    that:
      - not k3s_agent_config_stat.stat.exists or k3s_agent_config_marker.rc == 0
    fail_msg: An existing K3s config is not marked as managed by this repository; review it before changing it.
  when: k3s_agent_config_stat.stat.exists

- name: Create the K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the protected K3s agent configuration
  ansible.builtin.template:
    src: agent-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: true
  notify: Restart K3s agent

- name: Require HTTPS for the official K3s installer source
  ansible.builtin.assert:
    that:
      - k3s_install_script_url is match('^https://')
    fail_msg: K3s installer must be fetched over HTTPS.

- name: Download the K3s installer from the declared official endpoint
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: "{{ k3s_install_script_path }}"
    owner: root
    group: root
    mode: "0755"
    checksum: "{{ ('sha256:' ~ k3s_install_script_sha256) if (k3s_install_script_sha256 | length > 0) else omit }}"
    validate_certs: true
  when: not k3s_agent_binary.stat.exists

- name: Install the pinned K3s agent only when absent
  ansible.builtin.command:
    argv: [/bin/sh, "{{ k3s_install_script_path }}"]
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: agent
    INSTALL_K3S_SKIP_START: "true"
  when: not k3s_agent_binary.stat.exists
  no_log: true


- name: Create kubelet configuration drop-in directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Allow K3s kubelet to run with cgroup v1
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/99-cgroup-v1-compat.conf
    content: |
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      failCgroupV1: false
    owner: root
    group: root
    mode: "0600"

- name: Enable and start the K3s agent service
  ansible.builtin.systemd_service:
    name: k3s-agent
    state: started
    enabled: true

- name: Wait for the K3s agent service to become active
  ansible.builtin.command:
    argv: [systemctl, is-active, k3s-agent]
  register: k3s_agent_active
  changed_when: false
  retries: 30
  delay: 5
  until: k3s_agent_active.stdout | trim == 'active'
