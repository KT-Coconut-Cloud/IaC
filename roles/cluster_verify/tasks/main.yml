---
- name: Read Kubernetes nodes from the server or protected VMware kubeconfig
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, get, nodes, -o, json]
  register: cluster_verify_nodes_raw
  changed_when: false
  when: target_environment == 'ktcloud'

- name: Read VMware Kubernetes nodes without copying kubeconfig into the repository
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig, "{{ cluster_verify_kubeconfig }}", get, nodes, -o, json]
  register: cluster_verify_nodes_raw
  changed_when: false
  delegate_to: localhost
  become: false
  when: target_environment == 'vmware'

- name: Parse node state
  ansible.builtin.set_fact:
    cluster_verify_nodes: "{{ cluster_verify_nodes_raw.stdout | from_json }}"

- name: Require the exact expected node names
  ansible.builtin.assert:
    that:
      - cluster_verify_nodes.items | map(attribute='metadata.name') | list | sort == k3s_expected_nodes | sort
    fail_msg: Node set differs from the declared one-server/two-agent topology.

- name: Require every expected node to be Ready
  ansible.builtin.assert:
    that:
      - item.status.conditions | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length == 1
    fail_msg: "Kubernetes node {{ item.metadata.name }} is not Ready."
  loop: "{{ cluster_verify_nodes.items }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Read system pod state from the server
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, get, pods, --all-namespaces, -o, json]
  register: cluster_verify_pods_raw
  changed_when: false
  when: target_environment == 'ktcloud'

- name: Read VMware system pod state through the protected kubeconfig
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig, "{{ cluster_verify_kubeconfig }}", get, pods, --all-namespaces, -o, json]
  register: cluster_verify_pods_raw
  changed_when: false
  delegate_to: localhost
  become: false
  when: target_environment == 'vmware'

- name: Parse system pod state
  ansible.builtin.set_fact:
    cluster_verify_pods: "{{ cluster_verify_pods_raw.stdout | from_json }}"

- name: Require CoreDNS and Flannel workloads to exist and be ready
  ansible.builtin.assert:
    that:
      - cluster_verify_pods.items | selectattr('metadata.namespace', 'equalto', 'kube-system') | selectattr('metadata.name', 'search', 'coredns') | selectattr('status.phase', 'equalto', 'Running') | list | length > 0
      - cluster_verify_pods.items | selectattr('metadata.namespace', 'equalto', 'kube-system') | selectattr('metadata.name', 'search', 'flannel') | selectattr('status.phase', 'equalto', 'Running') | list | length > 0
    fail_msg: CoreDNS or Flannel is missing or not Running in kube-system.

- name: Install temporary network smoke verifier on the KT Cloud server
  ansible.builtin.copy:
    src: network_smoke.py
    dest: /usr/local/libexec/k3s-network-smoke.py
    owner: root
    group: root
    mode: "0755"
  when:
    - target_environment == 'ktcloud'
    - k3s_verify_network_smoke_tests | bool

- name: Exercise cross-node Pod, DNS, and dynamically allocated NodePort traffic
  ansible.builtin.command:
    argv:
      - "{{ '/usr/local/bin/python3.9' if target_environment == 'ktcloud' else 'python3' }}"
      - "{{ '/usr/local/libexec/k3s-network-smoke.py' if target_environment == 'ktcloud' else role_path ~ '/files/network_smoke.py' }}"
      - --workers
      - "{{ k3s_worker_nodes | join(',') }}"
      - --image
      - "{{ k3s_network_smoke_image }}"
  environment:
    KUBECONFIG: "{{ '/etc/rancher/k3s/k3s.yaml' if target_environment == 'ktcloud' else cluster_verify_kubeconfig }}"
  register: cluster_verify_network_smoke
  changed_when: true
  no_log: true
  when: k3s_verify_network_smoke_tests | bool
