---
- name: Require the existing controller virtual environment and key pair
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: true
  loop:
    - { path: "{{ controller_venv_path }}/bin/python" }
    - { path: "{{ controller_ansible_private_key }}" }
    - { path: "{{ controller_ansible_public_key }}" }
  register: controller_setup_required_files

- name: Fail rather than create or replace controller credentials
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: "Required existing controller file is missing: {{ item.item.path }}"
  loop: "{{ controller_setup_required_files.results }}"

- name: Verify Ansible is running from the existing dev312 environment
  ansible.builtin.assert:
    that:
      - ansible_playbook_python is search(controller_venv_path)
    fail_msg: Run Ansible from the existing /home/admin/dev312 environment.

- name: Check the existing Ansible version
  ansible.builtin.command:
    argv: [ansible-playbook, --version]
  register: controller_setup_ansible_version
  changed_when: false

- name: Require the recorded controller Ansible version
  ansible.builtin.assert:
    that:
      - controller_setup_ansible_version.stdout is search('core ' ~ controller_ansible_version)
    fail_msg: "Expected ansible-core {{ controller_ansible_version }} from the existing controller environment."

- name: Check for the pinned ansible.posix collection
  ansible.builtin.command:
    argv: [ansible-galaxy, collection, list, ansible.posix]
  register: controller_setup_posix_collection
  changed_when: false
  failed_when: false

- name: Install the pinned controller-side collection when missing
  ansible.builtin.command:
    argv:
      - ansible-galaxy
      - collection
      - install
      - -r
      - "{{ role_path }}/../../collections/requirements.yml"
  when: controller_setup_posix_collection.stdout is not search('ansible.posix\s+2.2.2')

- name: Validate the existing public key without exposing key material
  ansible.builtin.command:
    argv: [ssh-keygen, -lf, "{{ controller_ansible_public_key }}"]
  register: controller_setup_public_key_check
  changed_when: false
  no_log: true

- name: Ensure the existing SSH directory has private permissions
  ansible.builtin.file:
    path: "{{ controller_ssh_config_path | dirname }}"
    state: directory
    owner: "{{ lookup('env', 'USER') }}"
    mode: "0700"

- name: Set safe permissions on the existing private key without replacing it
  ansible.builtin.file:
    path: "{{ controller_ansible_private_key }}"
    mode: "0600"

- name: Create a dedicated SSH config include directory
  ansible.builtin.file:
    path: "{{ controller_ssh_config_dir }}"
    state: directory
    mode: "0700"

- name: Write only the Ansible-managed SSH config fragment
  ansible.builtin.template:
    src: ansible-k3s.conf.j2
    dest: "{{ controller_ssh_managed_config }}"
    owner: "{{ lookup('env', 'USER') }}"
    mode: "0600"
    backup: true

- name: Preserve existing SSH config and add a managed Include block
  ansible.builtin.blockinfile:
    path: "{{ controller_ssh_config_path }}"
    create: true
    owner: "{{ lookup('env', 'USER') }}"
    mode: "0600"
    marker: "# {mark} ANSIBLE K3S INCLUDE"
    insertbefore: BOF
    block: "Include {{ controller_ssh_managed_config }}"
    backup: true
