[defaults]
inventory = ./inventory/vmware/hosts.ini
remote_user = root
private_key_file = /home/admin/.ssh/id_ed25519_ansible
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
forks = 10
timeout = 10
display_args_to_stdout = False

[ssh_connection]
pipelining = True
